name: "Day 8: Infrastructure Setup"

on:
  push:
    branches: [ main ]

jobs:
  terraform-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: "Azure Login"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Apply"
        run: terraform apply -auto-approve