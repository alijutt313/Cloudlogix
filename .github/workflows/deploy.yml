name: Build, Test, and Deploy to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest
        run: python -m pytest

  terraform:
    name: Terraform Provisioning
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          ARM_USE_CLI: "false"
        run: |
          CLIENT_ID=\((echo "\)AZURE_CREDS" | jq -r .clientId)
          CLIENT_SECRET=\((echo "\)AZURE_CREDS" | jq -r .clientSecret)
          SUBSCRIPTION_ID=\((echo "\)AZURE_CREDS" | jq -r .subscriptionId)
          TENANT_ID=\((echo "\)AZURE_CREDS" | jq -r .tenantId)

          terraform init \
            -backend-config="client_id=$CLIENT_ID" \
            -backend-config="client_secret=$CLIENT_SECRET" \
            -backend-config="subscription_id=$SUBSCRIPTION_ID" \
            -backend-config="tenant_id=$TENANT_ID"

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          ARM_USE_CLI: "false"
        run: |
          export ARM_CLIENT_ID=\((echo "\)AZURE_CREDS" | jq -r .clientId)
          export ARM_CLIENT_SECRET=\((echo "\)AZURE_CREDS" | jq -r .clientSecret)
          export ARM_SUBSCRIPTION_ID=\((echo "\)AZURE_CREDS" | jq -r .subscriptionId)
          export ARM_TENANT_ID=\((echo "\)AZURE_CREDS" | jq -r .tenantId)

          terraform apply -auto-approve

      - name: Output Endpoint
        working-directory: ./terraform
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          ARM_USE_CLI: "false"
        run: |
          export ARM_CLIENT_ID=\((echo "\)AZURE_CREDS" | jq -r .clientId)
          export ARM_CLIENT_SECRET=\((echo "\)AZURE_CREDS" | jq -r .clientSecret)
          export ARM_SUBSCRIPTION_ID=\((echo "\)AZURE_CREDS" | jq -r .subscriptionId)
          export ARM_TENANT_ID=\((echo "\)AZURE_CREDS" | jq -r .tenantId)

          terraform output static_website_url